[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "testbudget"
version = "0.1.0"
description = "Choose which existing tests run on a pull request, in what order, and for how long, from the repository's own CI history."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "CSC 510 Group 9" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.scripts]
testbudget = "testbudget.cli:main"

[project.urls]
Repository = "https://github.com/ssbajjur-ncstate/SE-CSC-510-Group-9"

[tool.setuptools.packages.find]
include = ["testbudget*"]
