name: TestBudget plan

on:
  pull_request:
  push:
    branches: [main]

jobs:
  testbudget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Plan (before the tests)
        if: github.event_name == 'pull_request'
        uses: ./
        with:
          mode: plan
          base-ref: ${{ github.base_ref }}
          budget: "120"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run the full test suite (audit mode, plan is printed above)
        run: |
          python -m pip install -e ".[dev]"
          python -m pytest -q --junitxml=junit.xml

      - name: Ingest results (after the tests)
        if: always() && hashFiles('junit.xml') != ''
        uses: ./
        with:
          mode: ingest
          junit-path: junit.xml
