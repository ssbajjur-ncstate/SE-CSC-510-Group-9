name: TestBudget plan

on:
  pull_request:
  push:
    branches: [main]

jobs:
  testbudget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Plan (before the tests)
        if: github.event_name == 'pull_request'
        uses: ./
        with:
          mode: plan
          base-ref: ${{ github.base_ref }}
          budget: "120"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run the full test suite (audit mode, plan is printed above)
        run: |
          python -m pip install -e ".[dev]"
          python -m pytest -q --junitxml=junit.xml

      - name: Ingest results (after the tests)
        if: always() && hashFiles('junit.xml') != ''
        uses: ./
        with:
          mode: ingest
          junit-path: junit.xml

  external-caller:
    runs-on: ubuntu-latest
    steps:
      - name: Check out a stand-in external project
        run: |
          printf '[project]\nname = "dummy-project"\nversion = "0.0.1"\n' > pyproject.toml
          git init -q .

      - name: Check out the Action source in a subfolder
        uses: actions/checkout@v4
        with:
          path: tbaction

      - name: Run the Action from the external project
        uses: ./tbaction
        with:
          mode: ingest
          junit-path: tbaction/fixtures/sample_junit.xml

      - name: Verify TestBudget was installed, not the caller
        run: |
          python -m pip show testbudget
          if python -m pip show dummy-project; then echo "installed the caller by mistake"; exit 1; fi
          python -m testbudget.cli --help
